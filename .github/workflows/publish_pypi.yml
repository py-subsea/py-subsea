name: Publish Python package to PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/pysubsea/**'
      - 'README.md'
  workflow_dispatch:  # allows manual trigger

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # optional: use 3.11 for latest build tools

      - name: Install/Upgrade build tools
        run: |
          python -m pip install --upgrade pip setuptools>=68 wheel build twine

      - name: Build the package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PY_SUBSEA_PUBLISH }}
        run: python -m twine upload dist/* --non-interactive
